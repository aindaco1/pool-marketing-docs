name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      JEKYLL_ENV: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0"
          bundler-cache: true

      - name: Test documentation import and translation contracts
        run: |
          ruby scripts/test_sync_pool_docs.rb
          python3 -m venv /tmp/pool-docs-tests
          /tmp/pool-docs-tests/bin/pip install -r scripts/requirements-docs-i18n.txt
          /tmp/pool-docs-tests/bin/python scripts/test_build_spanish_docs.py

      - name: Build site
        run: bundle exec jekyll build --trace

      - name: Audit current documentation state
        run: python3 scripts/audit_docs_current_state.py

      - name: Audit internal links and anchors
        run: python3 scripts/audit_links.py

      - name: Audit SEO output
        run: python3 scripts/audit_seo.py

      - name: Audit support checkout contract
        run: python3 scripts/audit_support.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
