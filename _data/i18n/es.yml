home:
  eyebrow: Haz tu propia campaña de crowdfunding
  title: Una plataforma gratuita de crowdfunding para financiar tus proyectos.
  subtitle: "The Pool es un <strong>starter de código abierto</strong> para <em>campañas todo o nada</em>, <em>checkout multicampaña</em>, <em>reportes para campaign runners</em> y <em>flujos sin cuenta para supporters</em>."
  points:
    free: "<strong>100% gratis</strong> para usar, hacer fork y rebrandear."
    low_cost: "Diseñado alrededor de <strong>GitHub Pages, Cloudflare y Resend</strong>, con uso dinámico pensado para planes de bajo costo."
    no_account: "Los backers pueden pledgear y gestionar su apoyo <strong>sin crear una cuenta</strong>."
    paid: "Soporta <strong>carritos multicampaña</strong>, reward tiers, add-ons, propinas de plataforma y <strong>reportes para campaign runners</strong>."
  download_cta: Descargar el repositorio completo
  docs_cta: Explorar la documentación
  demo_cta: Demo
  stats:
    stack_label: Stack
    stack_value: Jekyll + Stripe + Cloudflare Worker + Resend + panel de administración
    hosting_label: Operación de bajo costo
    hosting_value: Hosting estático primero, con llamadas dinámicas enfocadas en checkout, estado en vivo y reportes
    supporter_label: Flujo del backer
    supporter_value: Checkout propio, magic links y carritos multicampaña
    license_label: Costo
    license_value: Gratis para hacer fork, optimizado para los free tiers de los servicios
  demo:
    eyebrow: Espacio para demo
    title: Espacio para un walkthrough
    body: Coloca aquí una demo corta de páginas de campaña, checkout o Manage Pledge para mostrar cómo funciona tu fork de punta a punta.
    placeholder: Walkthrough de campaña
    caption: Espacio reservado para un recorrido corto del producto.
    fallback: Tu navegador no soporta este video.
  positioning_heading: Hecho para creativos que hacen crowdfunding.
  positioning_intro: "Para <em>películas, álbumes, herramientas financiadas por la comunidad y convocatorias pagadas</em>... lo que quieras."
  positioning_cards:
    free_title: 100% gratis y forkeable
    free_body: "No hay <strong>licencia paga ni SaaS obligatorio,</strong> y no existe una dependencia cerrada <em>entre tu fork y tus campañas.</em>"
    free_link: Ver superficie de fork
    low_cost_title: Bajo costo por diseño
    low_cost_body_mid_1: sirve el sitio estático,
    low_cost_body_mid_2: resuelve las pocas rutas dinámicas y
    low_cost_body_end: se encarga del correo.
    low_cost_link: Revisar el modelo de hosting
    no_account_title: Apoyo sin cuenta
    no_account_body: "Los supporters pueden apoyar una campaña y gestionar su pledge mediante <strong>magic links por email</strong>. <em>¡No hacen falta cuentas!</em>"
    no_account_link: Inspeccionar gestión de pledges
    crowd_title: Listo para crowdsourcing
    crowd_body: "Usa <strong>tiers, montos personalizados, add-ons de campaña, diary updates</strong> y <strong>community decisions</strong> para mantener a tu audiencia involucrada."
    crowd_link: Explorar workflows de creadores
  platform_heading: Lo que ya trae el starter
  platform_intro: "El starter ya refleja el código <strong>v1.0.3</strong>: checkout propio, admin con roles, impuestos y envíos configurables, recordatorios de lanzamiento, embeds localizados y manejo de media pensado para performance."
  platform_cards:
    checkout_title: Checkout propio con Stripe
    checkout_body: "<strong>Un carrito propio del navegador con carga lazy del runtime, totales verificados por el Worker, UI de pago Stripe dentro del sitio, métodos guardados y precios con impuestos, envíos y propinas,</strong> además de <strong>soporte para bundles multicampaña</strong>."
    checkout_link: Revisar el worker de pledges
    funding_title: Ciclo de campaña todo o nada
    funding_body: "<strong>Estados upcoming, live y post-campaign, deadlines con timezone configurable, recordatorios opt-in de lanzamiento, stretch goals</strong> y el <strong>flujo de settlement para guardar ahora y cobrar después</strong>."
    funding_link: Leer el resumen de la plataforma
    merch_title: Add-ons, impuestos, envíos y propinas
    merch_body: "<strong>Merch de plataforma y add-ons de campaña con inventario, proveedores de impuestos configurables y envíos USPS con fallbacks,</strong> además de <strong>totales con propina</strong> consistentes entre checkout, emails, reportes y exports de fulfillment."
    merch_link: Ver merch y add-ons
    community_title: Updates, compartir y gestión de supporters
    community_body: "<strong>Entradas de production diary, announcements, community decisions, gestión de pledges con magic links por orden, links para compartir campañas</strong> y <strong>reportes para campaign runners</strong>."
    community_link: Explorar workflows de campaña
    customization_title: Admin y personalización pensados para forks
    customization_body: "<strong>Admin con roles, config estructurada, design tokens, rutas i18n, embeds hospedados, Stripe Elements tematizado, emails para supporters alineados con tu marca</strong> y <strong>uploads de media que preservan el source</strong>."
    customization_link: Abrir documentación de personalización
    operations_title: Performance, seguridad, accesibilidad y pruebas
    operations_body: "<strong>Bootstrap lazy del carrito, variantes WebP responsivas, embeds de video diferidos, minificación de assets, hardening de seguridad, baselines de accesibilidad, cobertura con Playwright, metadata SEO</strong> y <strong>documentación operativa</strong>."
    operations_link: Revisar documentación de operaciones
