home:
  eyebrow: Crowdfunding de código abierto para proyectos creativos
  title: Lanza tu propio sitio de crowdfunding todo o nada.
  subtitle: "The Pool es <strong>software gratuito y de código abierto para crowdfunding</strong> de películas, álbumes, herramientas, eventos y otros proyectos creativos. Los supporters pledgean sin crear cuentas; Stripe guarda la tarjeta y solo la cobra si la campaña llega a su meta."
  points:
    free: "<strong>Gratis</strong> para usar, copiar y rebrandear."
    low_cost: "Diseñado alrededor de <strong>GitHub Pages, Cloudflare y Resend</strong>, con uso dinámico pensado para presupuestos pequeños."
    no_account: "Los backers pueden pledgear y gestionar su apoyo <strong>sin crear una cuenta</strong>."
    paid: "Soporta <strong>checkout multicampaña</strong>, rewards, add-ons, propinas y <strong>reportes de pledges y fulfillment</strong>."
  download_cta: Descargar el código
  docs_cta: Explorar la documentación
  demo_cta: Demo
  stats:
    stack_label: Stack
    stack_value: Jekyll + Stripe + Cloudflare Worker + Resend + panel de administración
    hosting_label: Operación de bajo costo
    hosting_value: Hosting estático primero, con llamadas dinámicas enfocadas en checkout, estado en vivo y reportes
    supporter_label: Flujo del backer
    supporter_value: Checkout propio, links por email y carritos multicampaña
    license_label: Costo
    license_value: Gratis para hacer fork, optimizado para los free tiers de los servicios
  demo:
    eyebrow: Espacio para demo
    title: Espacio para un walkthrough
    body: Coloca aquí una demo corta de páginas de campaña, checkout o Manage Pledge para mostrar cómo funciona tu fork de punta a punta.
    placeholder: Walkthrough de campaña
    caption: Espacio reservado para un recorrido corto del producto.
    fallback: Tu navegador no soporta este video.
  positioning_heading: Qué hace The Pool
  positioning_intro: "Te da páginas de campaña, checkout, administración, emails y reportes sin entregar tu proyecto a una plataforma cerrada de crowdfunding."
  positioning_cards:
    free_title: Gratis y bajo tu control
    free_body: "No hay <strong>licencia paga</strong>. Cópialo, rebrandéalo y mantén el sitio de tu campaña bajo tu control."
    free_link: Ver superficie de fork
    low_cost_title: Hecho para hosting de bajo costo
    low_cost_body_mid_1: sirve el sitio estático,
    low_cost_body_mid_2: resuelve checkout, admin y estado en vivo, y
    low_cost_body_end: se encarga del correo.
    low_cost_link: Revisar el modelo de hosting
    no_account_title: Sin cuentas para supporters
    no_account_body: "Los backers pledgean, actualizan tarjetas, cambian pledges y abren páginas privadas mediante <strong>links seguros por email</strong>."
    no_account_link: Inspeccionar gestión de pledges
    crowd_title: Preparado para campañas reales
    crowd_body: "Usa <strong>rewards, pledges personalizados, add-ons, recordatorios de lanzamiento, updates, votaciones, blasts a supporters</strong> y reportes de fulfillment."
    crowd_link: Explorar workflows de creadores
  platform_heading: Lo que incluye hoy
  platform_intro: ""
  platform_cards:
    checkout_title: Checkout que protege la meta
    checkout_body: "Los supporters arman un carrito en tu sitio. Un backend pequeño en Cloudflare recalcula los totales desde datos confiables de campaña y Stripe guarda el método de pago. <strong>Un checkout puede incluir varias campañas, y cada campaña se cobra solo si tiene éxito.</strong>"
    checkout_link: Revisar el worker de pledges
    funding_title: Tiempos y resultados de campaña
    funding_body: "The Pool maneja <strong>campañas próximas, activas y finalizadas</strong>, deadlines en tu timezone, registros para recordatorios de lanzamiento, stretch goals y cobros por lotes después de una campaña exitosa."
    funding_link: Leer sobre The Pool
    merch_title: Rewards, add-ons, impuestos y envíos
    merch_body: "Ofrece reward tiers, add-ons de campaña, merch de plataforma, límites de inventario, propinas opcionales, proveedores de impuestos configurables, cotizaciones USPS y tarifas fallback de envío."
    merch_link: Ver merch y add-ons
    community_title: Seguimiento para supporters
    community_body: "Los backers gestionan pledges desde <strong>links por email</strong>. Las campañas pueden publicar diary updates, announcements, votaciones de supporters, links para compartir y blasts por email."
    community_link: Explorar workflows de campaña
    customization_title: Admin para el equipo
    customization_body: "El dashboard privado cubre setup de campañas, previews protegidos, contenido, media, usuarios, reportes, analytics, links de referral guardados, códigos QR y snippets de embed."
    customization_link: Abrir documentación de personalización
    operations_title: Bases listas para lanzar
    operations_body: "El proyecto está preparado para lanzar: páginas estáticas rápidas, media responsiva, video diferido, checks SEO, cobertura de accesibilidad, hardening de seguridad, auditorías de locales y tests automáticos de navegador."
    operations_link: Revisar documentación de operaciones
support:
  title: Apoya a The Pool
  eyebrow: Apoyo a Dust Wave
  body_prefix: "The Pool es infraestructura gratuita y de código abierto mantenida por "
  body_link: Dust Wave
  body_suffix: ". Tu apoyo da al proyecto más tiempo para un desarrollo cuidadoso, lanzamientos confiables y documentación útil."
  options_eyebrow: Opciones de apoyo
  options_title: Elige cómo quieres ayudar
  one_time_eyebrow: Apoyo único
  one_time_title: Elige tu cantidad
  one_time_body: Apoya una vez con la cantidad que funcione para ti.
  one_time_amount: "$10 sugeridos · elige cualquier cantidad"
  one_time_cta: Elegir una cantidad única
  monthly_eyebrow: Apoyo mensual
  monthly_title: Mantén el trabajo en movimiento
  monthly_body: Da apoyo constante para mantenimiento, lanzamientos y documentación.
  monthly_amount: $5 al mes
  monthly_cta: Apoyar con $5 al mes
  provider_note: Los pagos se procesan de forma segura mediante Stripe. El apoyo a Dust Wave no se presenta como una donación benéfica deducible de impuestos.
  funds_title: Qué financia tu apoyo
  funds_development: Desarrollo y mantenimiento continuo de la plataforma
  funds_docs: Documentación y ejemplos claros
  funds_releases: Trabajo de lanzamientos, accesibilidad y compatibilidad
  other_title: Otras formas de ayudar
  other_body: Si el apoyo financiero no es adecuado para ti, compartir The Pool, probar lanzamientos y reportar problemas precisos también ayuda al proyecto.
  other_cta: Visita The Pool en GitHub

