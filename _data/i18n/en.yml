home:
  eyebrow: DIY your own crowdfunding campaign
  title: A free crowdfunding platform to fund your projects.
  subtitle: "The Pool is an <strong>open-source starter</strong> for <em>all-or-nothing campaigns</em>, <em>multi-campaign checkout</em>, <em>campaign-runner reports</em>, and <em>no-account supporter flows</em>."
  points:
    free: "<strong>100% free</strong> to use, fork, and rebrand."
    low_cost: "Designed around <strong>GitHub Pages, Cloudflare, and Resend</strong>, with plan-friendly dynamic usage."
    no_account: "Backers can pledge and manage support with <strong>no account required</strong>."
    paid: "Supports <strong>multi-campaign carts</strong>, reward tiers, add-ons, platform tips, and <strong>campaign-runner reporting</strong>."
  download_cta: Download full repo
  docs_cta: Explore the docs
  demo_cta: Demo
  stats:
    stack_label: Stack
    stack_value: Jekyll + Stripe + Cloudflare Worker + Resend + admin dashboard
    hosting_label: Low-cost ops
    hosting_value: Static hosting first, dynamic calls focused on checkout, live state, and reporting
    supporter_label: Backer flow
    supporter_value: First-party checkout, magic links, multi-campaign carts
    license_label: Cost
    license_value: Free to fork, optimized for services' free tiers
  demo:
    eyebrow: Demo slot
    title: Room for a live walkthrough
    body: Drop in a short demo of campaign pages, checkout, or Manage Pledge to show how your fork works end to end.
    placeholder: Campaign walkthrough
    caption: Reserved space for a short product walkthrough.
    fallback: Your browser does not support this video.
  positioning_heading: Built for creatives who crowdfund.
  positioning_intro: "For <em>films, albums, community-backed tools, paid submissions</em> ... whatever you want."
  positioning_cards:
    free_title: 100% free and forkable
    free_body: "There is <strong>no license fee, no SaaS lock-in,</strong> and no closed platform dependency <em>between you and your campaigns.</em>"
    free_link: See the fork surface
    low_cost_title: Low-cost by design
    low_cost_body_mid_1: serves the static site,
    low_cost_body_mid_2: handles the few dynamic paths, and
    low_cost_body_end: takes care of email.
    low_cost_link: Review the hosting model
    no_account_title: No-account support
    no_account_body: "Supporters can back a campaign and manage their pledge through <strong>email magic links</strong>. <em>No accounts needed!</em>"
    no_account_link: Inspect pledge management
    crowd_title: Crowdsourcing Ready
    crowd_body: "Use <strong>tiers, custom amounts, campaign add-ons, diary updates,</strong> and <strong>community decisions</strong> to keep your audience engaged."
    crowd_link: Explore creator workflows
  platform_heading: What ships in the starter
  platform_intro: ""
  platform_cards:
    checkout_title: Checkout with server-side totals
    checkout_body: "Supporters build a cart in the browser. The Worker rebuilds prices from trusted campaign data, then Stripe saves the payment method on-site so you can charge only if the campaign succeeds. <strong>Multi-campaign carts are supported.</strong>"
    checkout_link: Review the pledge worker
    funding_title: Campaign states and charge timing
    funding_body: "The starter handles <strong>upcoming, live, and post-campaign states</strong>, deadline timing in your configured timezone, launch reminder signups, stretch goals, and batched settlement after a campaign closes."
    funding_link: Read about The Pool
    merch_title: Rewards, add-ons, tax, and shipping
    merch_body: "You get reward tiers, campaign add-ons, platform merch, inventory checks, configurable tax providers, USPS quotes, fallback shipping rates, and <strong>tip totals that stay aligned</strong> in checkout, email, and reports."
    merch_link: See merch and add-ons
    community_title: Supporter tools after checkout
    community_body: "Backers manage pledges from <strong>email magic links</strong>. Campaigns can publish diary updates, announcements, community decisions, share links, and runner-ready pledge and fulfillment reports."
    community_link: Explore campaign workflows
    customization_title: Admin tools for a forked site
    customization_body: "A <strong>role-scoped admin dashboard</strong> lets teams edit settings, campaigns, add-ons, content, users, reports, and media while structured config and design tokens handle normal rebranding work."
    customization_link: Open customization docs
    operations_title: Launch and maintenance basics
    operations_body: "The starter includes lazy cart loading, responsive media, deferred video embeds, asset minification, SEO metadata, accessibility baselines, security hardening, <strong>Playwright coverage</strong>, and ops docs."
    operations_link: Review operations docs
