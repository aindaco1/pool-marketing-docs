home:
  eyebrow: Open-source crowdfunding for creative work
  title: Run your own all-or-nothing crowdfunding site.
  subtitle: "The Pool is <strong>free, open-source crowdfunding software</strong> for films, albums, tools, events, and other creative work. Supporters pledge without making accounts; Stripe saves the card and charges it only after a campaign reaches its goal."
  points:
    free: "<strong>Free</strong> to use, copy, and rebrand."
    low_cost: "Designed around <strong>GitHub Pages, Cloudflare, and Resend</strong>, with budget-friendly dynamic usage."
    no_account: "Backers can pledge and manage support with <strong>no account required</strong>."
    paid: "Supports <strong>multi-campaign checkout</strong>, rewards, add-ons, tips, and <strong>pledge and fulfillment reports</strong>."
  download_cta: Download the code
  docs_cta: Explore the docs
  demo_cta: Demo
  stats:
    stack_label: Stack
    stack_value: Jekyll + Stripe + Cloudflare Worker + Resend + admin dashboard
    hosting_label: Low-cost ops
    hosting_value: Static hosting first, dynamic calls focused on checkout, live state, and reporting
    supporter_label: Backer flow
    supporter_value: First-party checkout, email magic links, multi-campaign carts
    license_label: Cost
    license_value: Free to fork, optimized for services' free tiers
  demo:
    eyebrow: Demo slot
    title: Room for a live walkthrough
    body: Drop in a short demo of campaign pages, checkout, or Manage Pledge to show how your fork works end to end.
    placeholder: Campaign walkthrough
    caption: Reserved space for a short product walkthrough.
    fallback: Your browser does not support this video.
  positioning_heading: What The Pool does
  positioning_intro: "It gives you campaign pages, checkout, admin tools, emails, and reports without handing your project to a closed crowdfunding platform."
  positioning_cards:
    free_title: Free and yours to run
    free_body: "There is <strong>no license fee</strong>. Copy it, rebrand it, and keep your campaign site under your control."
    free_link: See the fork surface
    low_cost_title: Made for low-cost hosting
    low_cost_body_mid_1: serves the static site,
    low_cost_body_mid_2: handles checkout, admin, and live campaign requests, and
    low_cost_body_end: takes care of email.
    low_cost_link: Review the hosting model
    no_account_title: No supporter accounts
    no_account_body: "Backers pledge, update cards, change pledges, and open supporter-only pages through <strong>secure email links</strong>."
    no_account_link: Inspect pledge management
    crowd_title: Built for real campaigns
    crowd_body: "Run <strong>rewards, custom pledges, add-ons, launch reminders, updates, votes, supporter blasts,</strong> and fulfillment reports."
    crowd_link: Explore creator workflows
  platform_heading: What is included today
  platform_intro: ""
  platform_cards:
    checkout_title: Pledge checkout that protects the goal
    checkout_body: "Supporters build a cart on your site. A small Cloudflare backend recalculates totals from trusted campaign data, then Stripe saves the payment method. <strong>One checkout can include several campaigns, and each campaign is charged only if it succeeds.</strong>"
    checkout_link: Review the pledge worker
    funding_title: Campaign timing and outcomes
    funding_body: "The Pool handles <strong>upcoming, live, and finished campaigns</strong>, deadline timing in your timezone, launch reminder signups, stretch goals, and batched charges after a successful campaign closes."
    funding_link: Read about The Pool
    merch_title: Rewards, add-ons, tax, and shipping
    merch_body: "Offer reward tiers, campaign add-ons, platform merch, inventory limits, optional platform tips, configurable tax providers, USPS quotes, and fallback shipping rates."
    merch_link: See merch and add-ons
    community_title: Supporter follow-up
    community_body: "Backers manage pledges from <strong>email magic links</strong>. Campaigns can publish diary updates, announcements, supporter votes, share links, and email blasts."
    community_link: Explore campaign workflows
    customization_title: Admin tools for the team
    customization_body: "The private dashboard covers campaign setup, protected previews, content, media, users, reports, analytics, saved referral links, QR codes, and embed snippets."
    customization_link: Open customization docs
    operations_title: Launch-ready basics
    operations_body: "The project is built for launch: fast static pages, responsive media, delayed video embeds, SEO checks, accessibility coverage, security hardening, locale audits, and automated browser tests."
    operations_link: Review operations docs
support:
  eyebrow: Support The Pool
  title: Support The Pool
  body: The Pool is free, open-source infrastructure maintained by Dust Wave. Your support gives the project more time for careful development, reliable releases, and useful documentation.
  brand_link: Meet Dust Wave
  options_eyebrow: Support options
  options_title: Choose how you want to help
  options_intro: Both options continue to a secure Stripe checkout. One-time support lets you choose the amount.
  one_time_eyebrow: One-time support
  one_time_title: Choose your amount
  one_time_body: Give once at the amount that works for you.
  one_time_amount: "$10 suggested · choose any amount"
  one_time_cta: Choose a one-time amount
  monthly_eyebrow: Monthly support
  monthly_title: Keep the work moving
  monthly_body: Provide steady support for maintenance, releases, and documentation.
  monthly_amount: $5 per month
  monthly_cta: Support for $5 monthly
  provider_note: Payments are processed securely by Stripe. Dust Wave support is not represented as a tax-deductible charitable donation.
  funds_title: What support funds
  funds_development: Ongoing platform development and maintenance
  funds_docs: Clear documentation and examples
  funds_releases: Release, accessibility, and compatibility work
  other_title: Other ways to help
  other_body: If financial support is not right for you, sharing The Pool, testing releases, and filing precise issues all help the project.
  other_cta: Visit The Pool on GitHub

